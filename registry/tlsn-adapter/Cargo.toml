[package]
name = "rbb-tlsn-adapter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tlsn = { path = "../vendor/tlsn/crates/tlsn", features = ["mozilla-certs"] }
anyhow = "1.0"
bincode = "1.3"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }

[profile.release]
debug = false
